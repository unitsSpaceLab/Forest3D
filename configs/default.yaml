# Forest3D Default Configuration
# Copy to ./forest3d.yaml or ~/.config/forest3d/config.yaml

# Blender configuration for asset conversion
blender:
  visual_decimation: 0.1      # 10% of original (for rendering)
  collision_decimation: 0.01  # 1% of original (for physics)

# Terrain generation settings
terrain:
  type: dem                # "dem", "crop_rows", or custom registered type
  scale_factor: 1.0        # Global scale multiplier

  # DEM-specific settings (used when type = "dem")
  dem:
    smooth_sigma: 1.0      # Gaussian smoothing (0 = no smoothing)
    enhance: false          # Enable DEM resolution enhancement
    enhance_scale: 6.0      # Enhancement scale factor

  # Crop-row settings (used when type = "crop_rows")
  crop_rows:
    field_length: 50.0      # Field length (X) in metres
    field_width: 30.0       # Field width (Y) in metres
    num_rows: 8             # Number of crop rows
    row_width: 1.0          # Width of each raised bed (m)
    furrow_width: 0.5       # Width of each furrow (m)
    row_height: 0.15        # Height of row above furrow (m)
    headland_width: 2.0     # Unplanted border width (m)
    resolution: 0.25        # Grid resolution (m/cell)
    row_profile: rounded    # flat, rounded, or trapezoid

# Model density for world generation
density:
  tree: 50
  bush: 10
  rock: 5
  grass: 50
  sand: 5
  crop: 0                  # Set > 0 to place crop plants in rows
